name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        jekyll: ["~> 4.4"]
        include:
          - ruby: "3.1"
            jekyll: "~> 3.10"
          - ruby: "3.3"
            jekyll: "~> 3.10"
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll }}
    name: Ruby ${{ matrix.ruby }}, Jekyll ${{ matrix.jekyll }}
    steps:
      - uses: actions/checkout@v5
      - name: Install cwebp and avifenc
        run: sudo apt-get update && sudo apt-get install -y webp libavif-bin
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
