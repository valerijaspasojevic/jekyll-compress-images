name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        jekyll: ["~> 4.4"]
        include:
          - ruby: "3.3"
            jekyll: "~> 3.10"
            os: ubuntu-latest
          # Oldest supported Ruby, not available on newer Ubuntu images
          - ruby: "2.7"
            jekyll: "~> 3.10"
            os: ubuntu-22.04
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll }}
    name: Ruby ${{ matrix.ruby }}, Jekyll ${{ matrix.jekyll }}
    steps:
      - uses: actions/checkout@v7
      # avifenc on Ubuntu 22.04 is too old (needs 1.0+), so the AVIF tests skip there
      - name: Install cwebp and avifenc
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          if [ "${{ matrix.os }}" != "ubuntu-22.04" ]; then sudo apt-get install -y libavif-bin; fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
